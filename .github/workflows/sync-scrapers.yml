name: Sync Upstream Scrapers

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream repository
        run: |
          git clone --depth 1 https://github.com/kalil0321/ats-scrapers.git /tmp/upstream-ats

      - name: Update tracking branch
        id: sync_tracking
        run: |
          # Checkout or initialize the dedicated synchronization branch
          if git show-ref --quiet refs/heads/upstream-sync; then
            git checkout upstream-sync
          else
            git checkout --orphan upstream-sync
            git rm -rf .
          fi

          # Align upstream files into the target folder structure
          mkdir -p src/scraping/scrapers
          rsync -av --delete --exclude '__pycache__' /tmp/upstream-ats/src/ats_scrapers/scrapers/ src/scraping/scrapers/
          
          # Rewrite import paths from upstream namespace to local project namespace
          python3 - << 'EOF'
          import os
          import re

          target_dir = "src/scraping/scrapers"
          # Pattern matches 'from ats_scrapers' or 'import ats_scrapers'
          pattern = re.compile(r'\b(from|import)\s+ats_scrapers\b')

          for root, _, files in os.walk(target_dir):
              for file in files:
                  if file.endswith(".py"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      # Replace with target namespace
                      new_content = pattern.sub(r'\1 src.scraping', content)

                      if new_content != content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(new_content)
          EOF

          git add src/scraping/scrapers

          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(sync): snapshot upstream ats-scrapers"
            git push origin upstream-sync
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into main branch
        if: steps.sync_tracking.outputs.has_changes == 'true'
        run: |
          git checkout main

          # Merge using -X theirs to automatically resolve content conflicts in favor of upstream
          # --allow-unrelated-histories is required for the initial merge
          if git merge --allow-unrelated-histories -X theirs upstream-sync -m "chore: sync scrapers from upstream with automatic conflict resolution"; then
            git push origin main
          else
            echo "Merge failed due to structural/tree conflicts that cannot be auto-resolved."
            git merge --abort
            exit 1
          fi