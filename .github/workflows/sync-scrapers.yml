name: Sync Upstream Scrapers

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream repository
        run: |
          git clone --depth 1 https://github.com/kalil0321/ats-scrapers.git /tmp/upstream-ats

      - name: Update tracking branch
        id: sync_tracking
        run: |
          # Use ls-remote to check the remote repository directly
          if git ls-remote --exit-code --heads origin upstream-sync >/dev/null 2>&1; then
            git checkout upstream-sync
          else
            git checkout --orphan upstream-sync
            git rm -rf .
          fi
          
          # 1. Sync scrapers
          mkdir -p src/scraping/scrapers
          rsync -av --delete --exclude '__pycache__' /tmp/upstream-ats/src/ats_scrapers/scrapers/ src/scraping/scrapers/
          
          # 2. Sync tests (including fixtures, excluding caches)
          mkdir -p tests
          rsync -av --delete --exclude '__pycache__' --exclude '.pytest_cache' /tmp/upstream-ats/tests/ tests/
          
          # 3. Rewrite imports across both source and test files
          python3 - << 'EOF'
          import os
          import re
          target_dirs = ["src/scraping/scrapers", "tests"]
          pattern = re.compile(r'\b(from|import)\s+ats_scrapers\b')
          for target_dir in target_dirs:
              if not os.path.exists(target_dir):
                  continue
              for root, _, files in os.walk(target_dir):
                  for file in files:
                      if file.endswith(".py"):
                          filepath = os.path.join(root, file)
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()
                          new_content = pattern.sub(r'\1 src.scraping', content)
                          if new_content != content:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(new_content)
          EOF
          
          git add src/scraping/scrapers tests
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(sync): snapshot upstream scrapers and tests with rewritten imports"
            git push origin upstream-sync
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.sync_tracking.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --base main --head upstream-sync --json url --jq '.[0].url')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --base main \
              --head upstream-sync \
              --title "chore: sync scrapers and tests from upstream" \
              --body "Automated PR to sync scrapers and tests from upstream repository."
          else
            echo "Pull request already exists: $PR_EXISTS"
          fi
